# FEP 공통 설정: 업무 앱 수정 없이 기관별 접속 정보와 전문 규격을 관리한다.
# mapper.type=common : YAML 규칙을 사용하는 공통 Mapper
# mapper.prefix      : 기관 전문 첫 번째 ASCII 문자(1바이트)
# mapper.type=custom : 특수 기관 전용 Mapper를 사용(현재 A/B는 모두 common)
fep:
  institutions:
    A:
      host: 127.0.0.1
      port: 9001
      connect-timeout: 3000
      read-timeout: 5000
      # Chapter 6: 기관별 최대 동시 TCP 연결 수 및 연결 대기시간(ms)
      pool:
        max-connections: 5
        borrow-timeout: 2000
        # 마지막 반납 후 20초 이상 경과한 연결은 다음 대여 시 폐기 후 재생성
        max-idle-ms: 20000
      mapper:
        type: common
        prefix: A
    B:
      host: 127.0.0.1
      port: 9002
      connect-timeout: 3000
      read-timeout: 5000
      # Chapter 6: 기관별 최대 동시 TCP 연결 수 및 연결 대기시간(ms)
      pool:
        max-connections: 5
        borrow-timeout: 2000
        # 마지막 반납 후 20초 이상 경과한 연결은 다음 대여 시 폐기 후 재생성
        max-idle-ms: 20000
      mapper:
        type: common
        prefix: B
